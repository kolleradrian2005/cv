name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tectonic
        run: |
          TECTONIC_VERSION=0.15.0
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tectonic
          tectonic --version

      - name: Compile cv.tex
        run: tectonic -X compile cv.tex --keep-logs

      - name: Sanity-check ATS extraction
        run: |
          python3 -m pip install --quiet pymupdf
          python3 -c "import fitz; t = fitz.open('cv.pdf')[0].get_text(); assert 'Adrián Koller' in t, 'Name not extractable'; print('ATS extraction OK')"

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp cv.pdf _site/cv.pdf
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Adrián Koller — CV</title>
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=cv.pdf">
            <link rel="canonical" href="cv.pdf">
            <style>
              body{font:16px/1.5 system-ui,sans-serif;margin:3rem auto;max-width:32rem;color:#0F2350;text-align:center}
              a{color:#0F2350}
            </style>
          </head>
          <body>
            <p>Redirecting to <a href="cv.pdf">cv.pdf</a>&hellip;</p>
          </body>
          </html>
          HTML

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: cv.pdf
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

